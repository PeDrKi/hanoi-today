name = "hanoi-today-api"
main = "worker.ts"
compatibility_date = "2024-09-01"

# 1) npx wrangler d1 create hanoi-today         → copy the database_id it prints into the line below
# 2) npx wrangler d1 execute hanoi-today --remote --file=schema.sql
# 3) npm run db:seed && npx wrangler d1 execute hanoi-today --remote --file=seed.sql   (from the project root: loads the built-in places)
# 4) npx wrangler secret put ADMIN_TOKENS      → who may use the Admin screen, e.g.  chu:Xk39...long-random:editor,ban:Yq82...long-random:viewer
#    (tokens ≥ 8 chars; roles: editor = may change data, viewer = read only). The older single ADMIN_TOKEN also works.
[[d1_databases]]
binding = "DB"
database_name = "hanoi-today"
database_id = "01775576-5268-4019-81e9-a3c13e76f3f4"

# Only your site may call the API from a browser:
[vars]
ALLOWED_ORIGIN = "https://hanoi-today.vercel.app"

# OPTIONAL — keep uploaded photos in Cloudflare R2 (10 GB free; the dashboard asks for a payment card to enable R2).
# Without it, photos go into the D1 database (fine for a few hundred small photos). To turn R2 on:
#   npx wrangler r2 bucket create hanoi-today-images      then remove the leading # on the 3 lines below and run: npm run deploy:api
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "hanoi-today-images"
